<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroTech - Catalogue</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="catalog-page">

  <!-- En-tête -->
  <header class="catalog-header">
    <div class="logo-area">
      <button id="sidebarToggleBtn" class="sidebar-toggle-btn">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span class="brand-name"><i class="fa-solid fa-plane-up"></i> AeroTech</span>
    </div>
    <div class="search-admin-area">
      <!-- Barre de recherche unique avec son conteneur et ses suggestions -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Rechercher..." autocomplete="off">
        <div id="suggestions-box" class="suggestions-dropdown hidden"></div>
      </div>

      <!-- Lien vers la page admin -->
      <a href="admin.html" class="admin-link">
        <i class="fa-solid fa-user-gear"></i> Admin
      </a>
    </div>
  </header>

  <div class="catalog-layout">
    
    <!-- Sidebar Rétractable avec menus en cascade -->
    <aside class="sidebar-filters" id="sidebarFilters">
      <h2><i class="fa-solid fa-filter"></i> Filtres</h2>
      
      <!-- Catégorie 1 : Avions de Chasse -->
      <div class="filter-group">
        <button class="category-btn" id="btnChasse">
          <i class="fa-solid fa-jet-fighter"></i> Avions de Chasse <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="sub-group hidden" id="groupGenerations">
          <h4>Générations</h4>
          <button class="filter-btn gen-btn" data-gen="gen1">1ère Génération</button>
          <button class="filter-btn gen-btn" data-gen="gen2">2ème Génération</button>
          <button class="filter-btn gen-btn" data-gen="gen3">3ème Génération</button>
          <button class="filter-btn gen-btn" data-gen="gen4">4ème Génération</button>
          <button class="filter-btn gen-btn" data-gen="gen5">5ème Génération</button>
        </div>
      </div>

      <!-- Catégorie 2 : Constructeurs (Dynamique depuis Firestore) -->
      <div class="filter-group">
        <button class="category-btn" id="btnCommercial">
          <i class="fa-solid fa-plane"></i> Constructeurs <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="sub-group hidden" id="groupConstructeurs">
          <h4>Constructeurs</h4>
          <!-- Injecté dynamiquement par JS -->
        </div>
      </div>

      <!-- Catégorie 3 : Compagnies Aériennes (Dynamique depuis Firestore) -->
      <div class="filter-group">
        <button class="category-btn" id="btnCompagnies">
          <i class="fa-solid fa-earth-americas"></i> Compagnies Aériennes <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="sub-group hidden" id="groupCompagnies">
          <h4>Compagnies Aériennes</h4>
          <!-- Injecté dynamiquement par JS -->
        </div>
      </div>

      <button class="btn-main reset-btn" id="resetFiltersBtn" style="width: 100%; margin-top: 20px;">Afficher Tout</button>
    </aside>

    <!-- Grille des avions (Contenu Principal) -->
    <main class="catalog-main-content">
      <div class="catalog-grid" id="catalogGrid">
        <!-- Les cartes des avions seront injectées dynamiquement ici par JavaScript depuis Firestore -->
      </div>
    </main>

  </div>

  <!-- Script pour charger dynamiquement les filtres depuis Firestore -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9z1PQMyrZ2_t3_weFQ2d1W-LBQsnaQak",
      authDomain: "aerotech-d1e11.firebaseapp.com",
      projectId: "aerotech-d1e11",
      storageBucket: "aerotech-d1e11.firebasestorage.app",
      messagingSenderId: "404962146166",
      appId: "1:404962146166:web:d27d39f7d5dbef03d86c57",
      measurementId: "G-C85193Y7BJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function chargerFiltresSidebar() {
      try {
        // 1. Charger les constructeurs
        const constContainer = document.getElementById('groupConstructeurs');
        if (constContainer) {
          const constSnapshot = await getDocs(collection(db, "constructors"));
          const h4 = constContainer.querySelector('h4');
          constContainer.innerHTML = "";
          if (h4) constContainer.appendChild(h4);

          constSnapshot.forEach(docSnap => {
            const data = docSnap.data();
            const btn = document.createElement('button');
            btn.className = 'filter-btn constructor-filter-btn';
            btn.setAttribute('data-constructor', data.name);
            btn.textContent = data.name;
            constContainer.appendChild(btn);
          });
        }

        // 2. Charger les compagnies aériennes
        const airlineContainer = document.getElementById('groupCompagnies');
        if (airlineContainer) {
          const airlineSnapshot = await getDocs(collection(db, "airlines"));
          const h4 = airlineContainer.querySelector('h4');
          airlineContainer.innerHTML = "";
          if (h4) airlineContainer.appendChild(h4);

          airlineSnapshot.forEach(docSnap => {
            const data = docSnap.data();
            const btn = document.createElement('button');
            btn.className = 'filter-btn airline-filter-btn';
            btn.setAttribute('data-airline', data.name);
            btn.textContent = data.name;
            airlineContainer.appendChild(btn);
          });
        }

      } catch (error) {
        console.error("Erreur lors du chargement des filtres dynamiques :", error);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      chargerFiltresSidebar();
    });
  </script>

  <script type="module" src="script.js"></script>
</body>
</html>
